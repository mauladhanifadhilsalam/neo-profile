name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

permissions:
  contents: read

jobs:
  build:
    # Pinned, not ubuntu-latest: the pinned Playwright installs Chromium only on the
    # Ubuntu releases it knows, and ubuntu-latest moves on without asking.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for the PDF and social card
        run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npm run check:links
      - run: npm run check:a11y
